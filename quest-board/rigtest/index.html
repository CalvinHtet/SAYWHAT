<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rig Review</title>
<style>
  body { margin: 0; padding: 6px; background: #6d6e80; color: #fff; font: 11px system-ui, sans-serif; }
  #grid { display: flex; flex-wrap: wrap; gap: 0; }
  figure { margin: 0; text-align: center; }
  canvas { display: block; height: 136px; }
  #err { color: #ffb4b4; white-space: pre-wrap; }
</style>
<div id="err"></div>
<div id="grid"></div>
<script src="../src/rig.js"></script>
<script src="../src/look.js"></script>
<script>
// ?c={"body":"f"}  a creator choice as JSON
// &clips=walk,type  which clips (default all)    &n=4  frames sampled per clip    &h=136  frame height
// &only=top,pants   draw just these layers
(async () => {
  try {
    const q = new URLSearchParams(location.search);
    const get = (p) => fetch("../data/" + p).then((r) => r.json());
    const [rigData, bodies, allPoses, data] = await Promise.all([get("rig.json"), get("bodies.json"), get("poses.json"), get("creator.json")]);
    const { clips, ...poses } = allPoses;
    const rig = await QBRig.create({ rig: rigData, bodies, poses, clips, assetUrl: (p) => "../art/app/" + p });
    const look = QBLook.build(data, JSON.parse(q.get("c") || "{}"));
    if (q.get("only")) for (const k of Object.keys(look.layers)) if (!q.get("only").split(",").includes(k)) delete look.layers[k];
    const n = +(q.get("n") || 4);
    if (q.get("h")) document.head.append(Object.assign(document.createElement("style"), { textContent: `canvas{height:${+q.get("h")}px}` }));
    const grid = document.getElementById("grid");
    for (const name of (q.get("clips") || Object.keys(clips).join(",")).split(",")) {
      const total = clips[name].frames;
      for (let i = 0; i < n; i++) {
        const f = q.get("f") ? +q.get("f") : Math.round(i * total / n);
        const c = document.createElement("canvas");
        c.width = rigData.frame[0]; c.height = rigData.frame[1];
        c.getContext("2d").drawImage(await rig.render(look, rig.clipPose(name, f)), 0, 0);
        const fig = document.createElement("figure");
        fig.append(c, Object.assign(document.createElement("figcaption"), { textContent: name + " " + f }));
        grid.append(fig);
      }
    }
    document.title = "ready";
  } catch (e) {
    document.getElementById("err").textContent = e.stack || e;
    document.title = "error";
  }
})();
</script>
