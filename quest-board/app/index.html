<style>
/* Layout: one column game HUD. Committed single dark look on purpose: each job rank re-skins the whole interface (palette, type, card shape), so there is no light variant. Level FX stack on top of the rank skin. */
:root{
  --bg:#07060d; --surface:#100f1c; --surface2:#1a1830; --line:#2a2650; --fg:#f1f0fb; --muted:#8d89ad;
  --accent:#4f8cff; --accent2:#8b5cff; --accent-ink:#030814; --done:#4dffc3; --gold:#ffc857;
  --glow1:rgba(79,140,255,.16); --glow2:rgba(139,92,255,.20); --shadow:rgba(79,140,255,.26); --gridc:rgba(79,140,255,.07);
  --s-creativity:#ff3d81; --s-discipline:#a78bfa; --s-fitness:#4dffc3; --s-productivity:#ffc857; --s-social:#6cb6ff;
  --font-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gk:0;
  color-scheme:dark;
}
:root[data-rank="D"]{--bg:#030a14;--surface:#08121f;--surface2:#0e1d30;--line:#17406a;--fg:#e8f6ff;--muted:#7ea2bd;--accent:#22d3ee;--accent2:#3b82f6;--accent-ink:#021018;--gold:#ffd166;
  --glow1:rgba(34,211,238,.16);--glow2:rgba(59,130,246,.24);--shadow:rgba(34,211,238,.28);--gridc:rgba(34,211,238,.08);--font-display:"Orbitron","Chakra Petch",system-ui,sans-serif}
:root[data-rank="C"]{--bg:#0d0604;--surface:#190b08;--surface2:#271210;--line:#6a2f16;--fg:#fff1e6;--muted:#bb927b;--accent:#ff8a3d;--accent2:#ff3d3d;--accent-ink:#1a0800;--gold:#ffd27a;
  --glow1:rgba(255,138,61,.18);--glow2:rgba(255,61,61,.20);--shadow:rgba(255,138,61,.30);--gridc:rgba(255,138,61,.08);--font-display:"Rajdhani","Chakra Petch",system-ui,sans-serif}
:root[data-rank="B"]{--bg:#0b0508;--surface:#170a11;--surface2:#26111b;--line:#57172d;--fg:#ffeef2;--muted:#b98a98;--accent:#ff2e4d;--accent2:#c026d3;--accent-ink:#ffffff;--gold:#ffc857;
  --glow1:rgba(255,46,77,.18);--glow2:rgba(192,38,211,.22);--shadow:rgba(255,46,77,.30);--gridc:rgba(255,46,77,.08);--font-display:"Michroma","Chakra Petch",system-ui,sans-serif}
:root[data-rank="A"]{--bg:#05060d;--surface:#0b0e1d;--surface2:#131830;--line:#5a4a18;--fg:#fff8e6;--muted:#aaa27e;--accent:#f5c451;--accent2:#fff0b3;--accent-ink:#1a1200;--gold:#f5c451;
  --glow1:rgba(245,196,81,.16);--glow2:rgba(90,110,255,.18);--shadow:rgba(245,196,81,.30);--gridc:rgba(245,196,81,.07);--font-display:"Cinzel","Chakra Petch",Georgia,serif}
:root[data-rank="S"]{--bg:#04020a;--surface:#0c0618;--surface2:#170c2c;--line:#3f2a72;--fg:#f6f1ff;--muted:#9d8cc4;--accent:#b388ff;--accent2:#7c4dff;--accent-ink:#0d0420;--gold:#e9d5ff;
  --glow1:rgba(179,136,255,.22);--glow2:rgba(124,77,255,.30);--shadow:rgba(179,136,255,.38);--gridc:rgba(179,136,255,.08);--font-display:"Cinzel","Chakra Petch",Georgia,serif}

*{box-sizing:border-box}
body{margin:0;background:
    radial-gradient(70% 38% at 88% -8%,var(--glow2),transparent 70%),
    radial-gradient(60% 30% at -6% 4%,var(--glow1),transparent 70%),
    var(--bg);
  background-repeat:no-repeat;background-attachment:fixed;color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;overflow-x:clip}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
h1,h2,h3,p{margin:0}
h2,h3{font-family:var(--font-display);text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.card{position:relative;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(140deg,var(--line),transparent 45%,var(--line)) border-box;border:1px solid transparent;border-radius:16px}

/* rank skins: card shapes */
html[data-rank="D"] .card{border-radius:6px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
html[data-rank="D"] .btn{border-radius:4px}
html[data-rank="C"] .card{border-radius:10px;border-width:2px}
html[data-rank="C"] .q{border-width:2px}
html[data-rank="B"] .card{border-radius:2px;border-top:3px solid var(--accent)}
html[data-rank="B"] .btn,html[data-rank="B"] .q,html[data-rank="B"] textarea{border-radius:2px}
html[data-rank="B"] .now h2{font-size:21px}html[data-rank="B"] .hero .xp{font-size:22px}html[data-rank="B"] .ring .c b{font-size:38px}html[data-rank="B"] .modal h2{font-size:28px}
html[data-rank="A"] .card{border-radius:8px;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(160deg,var(--accent),transparent 40%,var(--accent)) border-box}
html[data-rank="A"] .label,html[data-rank="S"] .label{letter-spacing:.28em}
html[data-rank="S"] .card{border-radius:18px;background:linear-gradient(rgba(12,6,24,.78),rgba(12,6,24,.78)) padding-box,linear-gradient(140deg,var(--accent),transparent 50%,var(--accent2)) border-box;backdrop-filter:blur(10px)}

/* top strip */
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px}
.strip .brand{font-family:var(--font-display);font-weight:700;letter-spacing:.28em;font-size:13px;text-transform:uppercase}
.strip .brand i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:10px;box-shadow:0 0 12px var(--accent);transform:rotate(45deg)}
.rankpill{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);box-shadow:0 0 14px -4px var(--shadow)}
.rankpill b{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 6px;margin-right:8px}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:20px;overflow:hidden;box-shadow:0 18px 50px -24px var(--shadow),0 0 calc(var(--gk)*40px) -12px var(--shadow)}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .t{fill:none;stroke:var(--surface2);stroke-width:9}
.ring .p{fill:none;stroke:url(#rg);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--shadow))}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .c small{font-family:var(--font-display);font-size:10px;letter-spacing:.3em;color:var(--muted);font-weight:600}
.ring .c b{font-family:var(--font-display);font-size:52px;font-weight:700;background:linear-gradient(160deg,var(--fg),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .xp{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1}
.hero .xp span{font-size:15px;color:var(--muted);margin-left:6px;font-weight:600}
.meta{display:grid;grid-template-columns:repeat(3,auto);gap:6px 16px;justify-content:start;margin-top:12px}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta b{font-size:17px}
.next{margin-top:12px;padding:8px 10px;border-radius:8px;background:var(--surface2);font-size:13px;color:var(--muted)}
.next b{color:var(--gold)}
.upg{margin-top:8px;font-size:12px;color:var(--muted)}
.upg b{color:var(--accent)}

/* gate trial */
.gate{padding:20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--gold);background:linear-gradient(160deg,var(--surface),var(--surface2));box-shadow:0 0 0 1px var(--shadow),0 0 46px -10px var(--shadow);animation:gatepulse 2.4s ease-in-out infinite}
@keyframes gatepulse{50%{box-shadow:0 0 0 1px var(--shadow),0 0 64px -4px var(--shadow)}}
.gate h2{font-size:26px;line-height:1.1;color:var(--gold)}
.gate ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}
.stored{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;background:var(--surface2);font-size:13px}
.stored b{color:var(--done)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proof{display:flex;flex-direction:column;gap:6px;font-size:13px}
.proof div{display:grid;grid-template-columns:20px 1fr;gap:6px}
.proof .ok{color:var(--done)}.proof .bad{color:var(--accent)}.proof .info{color:var(--muted)}

/* capture */
.capture{padding:14px;display:flex;flex-direction:column;gap:10px}
.cap-row{display:flex;gap:10px;align-items:stretch}
textarea{flex:1;min-width:0;resize:none;font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.35;min-height:48px}
textarea::placeholder{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;border:0;border-radius:12px;padding:0 20px;font-weight:700;background:linear-gradient(120deg,var(--accent),var(--accent2));color:var(--accent-ink);font-family:var(--font-display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;min-height:48px;box-shadow:0 8px 22px -10px var(--shadow);cursor:pointer}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:progress}
.btn.big{width:100%;font-size:17px;padding:14px 18px}
.btn.alt{background:var(--surface2);color:var(--fg);border:1px solid var(--accent);box-shadow:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-size:13px;padding:0 14px;min-height:38px;font-family:var(--font-body);font-weight:500;letter-spacing:0;text-transform:none;box-shadow:none}
.cap-status{font-size:13px;color:var(--muted);min-height:18px}
.cap-status b{color:var(--gold)}

/* now */
.now{padding:20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;border:1px solid var(--accent);background:linear-gradient(160deg,var(--surface),var(--surface2));box-shadow:0 0 0 1px var(--shadow),0 18px 50px -24px var(--shadow)}
.now h2{font-size:30px;font-weight:700;line-height:1.08}
.now .why{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--font-mono);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.xp{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.chip.big{color:var(--accent-ink);background:var(--gold);border-color:var(--gold);box-shadow:0 0 14px color-mix(in srgb,var(--gold) 55%,transparent)}
.chip.mult{color:var(--accent);border-color:var(--accent)}
.allclear{padding:20px;border:1px solid var(--done)}
.allclear h2{color:var(--done);font-size:28px}

/* run order */
.cluster{display:flex;flex-direction:column;gap:8px}
.cluster header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px}
.cbar{height:2px;background:var(--surface2);border-radius:2px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--done)}
.q{display:grid;grid-template-columns:1fr auto;align-items:stretch;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.q.current{border-color:var(--accent)}
.qmain{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:none;border:0;padding:11px 12px;text-align:left;min-width:0}
.q .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px;font-weight:700;line-height:1;color:transparent;transition:background .15s,border-color .15s}
.q.done .box{background:var(--done);border-color:var(--done);color:var(--bg)}
.q.done .name{color:var(--muted);text-decoration:line-through}
.q .name{display:block;overflow-wrap:anywhere}
.q .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.q .tags{display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%}
.x{background:none;border:0;border-left:1px solid var(--line);color:var(--muted);padding:0 12px;font-size:18px;line-height:1}
.x:hover{color:var(--accent)}
.q.new{animation:in .9s ease-out}
@keyframes in{from{box-shadow:0 0 0 2px var(--accent),0 0 24px var(--shadow);transform:translateY(6px);opacity:.4}to{box-shadow:0 0 0 0 transparent;transform:none;opacity:1}}

/* panels */
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.ladder{display:flex;flex-direction:column;gap:8px}
.rw{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid transparent}
.rw .lv{font-family:var(--font-display);font-weight:700}
.rw small{display:block;color:var(--muted);font-size:12px}
.rw .st{font-size:11px;font-family:var(--font-mono);color:var(--muted);letter-spacing:.08em}
.rw.ready{border-color:var(--gold);box-shadow:0 0 22px -6px var(--gold)}
.rw.ready .lv{color:var(--gold)}
.rw.mystery{border:1px dashed var(--line);color:var(--muted)}
.rw .claim{padding:0 14px;min-height:36px;font-size:12px}
.stat{display:grid;grid-template-columns:108px 1fr 34px;gap:10px;align-items:center}
.stat .track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.stat .fill{height:100%;border-radius:4px;box-shadow:0 0 10px currentColor}
.stat .n{text-align:right}
.radar{width:100%;max-width:300px;margin:0 auto;display:block;overflow:visible}
.titles{display:flex;gap:6px;flex-wrap:wrap}
.titles .chip{font-family:var(--font-body)}
.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:13px}

/* trophies, proof */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tr{padding:10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:2px}
.tr b{font-family:var(--font-display)}
.tr small{color:var(--muted);font-size:11px}
.tr.got{border-color:var(--gold);box-shadow:0 0 16px -6px var(--gold)}
.tr.got b{color:var(--gold)}
.tr.lock{color:var(--muted);border-style:dashed}
.vtag{color:var(--done)}
.streakline{margin-top:8px;font-size:12px;color:var(--muted)}
.streakline b{color:var(--gold)}
.integ{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.integ .track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.integ .track i{display:block;height:100%;background:var(--done)}
.integ.low .track i{background:var(--accent)}
/* classes, tiers, wheel, away */
.banner{padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.banner h3{font-family:var(--font-display);font-size:19px;line-height:1.1}
.banner .sub{color:var(--muted);font-size:12px;margin-top:2px}
.banner .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.banner .btn{min-height:34px;font-size:12px;padding:0 12px}
.emblem{display:block}
.emblem .seg{fill:none;stroke-width:3.5;stroke-linecap:round}
.emblem .on{stroke:var(--accent);filter:drop-shadow(0 0 3px var(--accent))}
.emblem .off{stroke:var(--line)}
.emblem .core{fill:var(--accent)}
.emblem .core2{fill:var(--accent2)}
.emblem .strk{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.emblem .pulse{transform-box:fill-box;transform-origin:center;animation:epulse 2.4s ease-in-out infinite}
@keyframes epulse{50%{transform:scale(1.1);opacity:.8}}
.emblem .eqb{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
.picks{display:flex;flex-direction:column;gap:8px}
.pickcard{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:inherit;cursor:pointer;width:100%}
.pickcard.on{border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
.pickcard b{font-family:var(--font-display);display:block}
.pickcard small{color:var(--muted);font-size:12px;display:block}
.pickinfo{min-height:64px;padding:10px;border-radius:12px;background:var(--surface2);font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:4px;vertical-align:-2px}

.rsp-help{margin:2px 0 12px}
/* brand logos */
.blg{display:inline-flex;align-items:center;gap:10px}
.blg>span{display:flex;flex-direction:column}
.blg_e{width:44px;height:44px;object-fit:contain;flex:none}
.blg.big .blg_e{width:78px;height:78px}
.blg_over b{font-family:"Arial Black",Impact,sans-serif;letter-spacing:.06em;font-style:italic;color:#fff;text-shadow:3px 3px 0 #ff6a1a}
.blg_y2k b{font-style:italic;background:linear-gradient(180deg,#fff,#ffc4e6 45%,#b46bff 55%,#6cf0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.blg_hanga b{letter-spacing:.14em;color:#e9e2d0}
/* new brand splash */
.bsplash{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--b1),var(--b2) 55%,var(--b3))!important;color:#fff;text-align:center;padding-top:24px}
.bsplash:before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(rgba(255,255,255,.06) 0 12deg,transparent 12deg 24deg);animation:bsspin 40s linear infinite;pointer-events:none}
@keyframes bsspin{to{transform:rotate(360deg)}}
.bsplash>*{position:relative}
.bs-burst{display:inline-block;padding:7px 16px;margin-bottom:12px;font:900 19px/1 "Arial Black",Impact,sans-serif;letter-spacing:.05em;color:#111;background:var(--ba);transform:rotate(-3deg);box-shadow:4px 4px 0 rgba(0,0,0,.45);animation:bspop .7s ease-out both}
@keyframes bspop{0%{transform:scale(.3) rotate(-14deg);opacity:0}70%{transform:scale(1.12) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
.bs-tag{margin:8px 0 14px;font-size:14px;opacity:.92}
.bs-items{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}
.bs-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.93);color:#141416}
.bs-item img{width:84px;height:84px;object-fit:contain}
.bs-item b{font-size:12.5px;line-height:1.2}.bs-item span{font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.bs-go{width:100%}

/* room screen: the room stays in view, only the list below it scrolls */
.rmodal{display:flex!important;flex-direction:column;max-height:92vh!important;overflow:hidden!important}
.rmodal .rm-title{font-size:22px;margin:0 34px 8px 0;flex:none}
.rmodal .rbig{flex:0 0 auto;height:min(40vh,340px);aspect-ratio:auto!important;max-height:60vh;margin-left:-12px;margin-right:-12px}
.rm-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin-top:10px;padding-right:4px;display:flex;flex-direction:column;gap:10px}
.rm-scroll>*{flex-shrink:0}
.dropname{pointer-events:none}

.gfw{stroke-dasharray:7 6;animation:gfw .7s linear infinite}
@keyframes gfw{to{stroke-dashoffset:-13}}
.gfr{transform-box:fill-box;transform-origin:center;animation:gfr 1.8s ease-out infinite}
@keyframes gfr{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}

.prtG{animation:prtG 1.8s ease-in-out infinite}
@keyframes prtG{0%,100%{opacity:.35}50%{opacity:.85}}
.prtH{animation:prtH 1.6s ease-in-out infinite}
@keyframes prtH{0%,100%{opacity:.25}50%{opacity:.9}}
.prtA{animation:prtA 1.1s ease-in-out infinite}
@keyframes prtA{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-6px)}}

.mvS{opacity:0;animation:mvS 48s linear infinite}
@keyframes mvS{0%{opacity:0}1%{opacity:1}16%{opacity:1}17%{opacity:0}100%{opacity:0}}
.mvX{animation:mvX 7s linear infinite}@keyframes mvX{from{transform:translateX(-50px)}to{transform:translateX(170px)}}
.mvXr{animation:mvXr 8s linear infinite}@keyframes mvXr{from{transform:translateX(90px)}to{transform:translateX(-160px)}}
.mvL{animation:scrB .25s linear infinite alternate}
.mvB{transform-box:fill-box;transform-origin:center;animation:mvB 1.6s ease-out infinite}@keyframes mvB{0%{transform:scale(.1);opacity:1}100%{transform:scale(1.6);opacity:0}}
.mvW{transform-box:fill-box;transform-origin:50% 100%;animation:mvW .5s ease-in-out infinite alternate}@keyframes mvW{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
.mvU{animation:mvU 4s linear infinite}@keyframes mvU{to{transform:translateY(-90px)}}
.mvF{animation:mvF 1.4s linear infinite}@keyframes mvF{0%,70%{opacity:0}75%,85%{opacity:1}100%{opacity:0}}
.mvD{animation:mvD 5s linear infinite}@keyframes mvD{to{transform:translate(-30px,90px)}}
.mvK{animation:mvK 2s ease-in-out infinite}@keyframes mvK{0%,100%{transform:translate(-14px,4px)}50%{transform:translate(6px,-2px)}}
.mvBeam{animation:mvBm 3s ease-in-out infinite}@keyframes mvBm{50%{opacity:.6}}
/* ROOMS: the Loft is all fixed-position, so the page measured only its header (331px on an 844px phone), which is what a host sizing its frame to the content would use. A one-screen view takes the frame's full height. */
html:has(#lfwrap),html:has(#lfwrap) body{height:100%}
/* LEAD: brand banner art. The shade sits above the art (z-index -2) and below the text, so white text reads on bright art. Edges stay clear to show the painting. */
.qs-banner .qs-bnshade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 56% 86% at 50% 50%,rgba(6,6,10,.62) 0%,rgba(6,6,10,.5) 55%,rgba(6,6,10,0) 100%)}
.qs-banner .qs-bnart{filter:saturate(1.12)}
.qs-banner.has-art .qs-bnkick,.qs-banner.has-art p,.qs-banner.has-art small{text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 12px rgba(0,0,0,.55)}

.qshop{--font-shop:"Bebas Neue Light","DM Sans",system-ui,sans-serif;--soft:#57514a}
.qshop .qs-top small,.qshop .qs-tab,.qshop .qs-coin,.qshop .qs-note,.qshop .qs-empty,.qshop .qs-worn b,.qshop .qs-worn small,.qshop .qs-card h4,.qshop .qs-card p,.qshop .qs-btn,.qshop .note,.qshop .label,.qshop .item small,.qshop .item .btn,.qs-bnkick,.qs-banner p,.qs-banner .blg small,.qshop .qs-cd{font-family:var(--font-shop);font-weight:400;letter-spacing:.07em}
.qshop .qs-top small{font-size:16px}
.qshop .qs-tab{font-size:18px;line-height:1}
.qshop .qs-coin{font-size:18px}
.qshop .qs-note,.qshop .qs-empty{font-size:17px}
.qshop .qs-worn b{font-size:19px}
.qshop .qs-worn small{font-size:15px;line-height:1.2}
.qshop .qs-card h4{font-size:19px;line-height:1.1}
.qshop .qs-card p{font-size:15px;line-height:1.2}
.qshop .qs-btn,.qshop .item .btn{font-size:17px}
.qshop .item small{font-size:15px;line-height:1.2}
.qs-bnkick{font-size:14px;letter-spacing:.3em}
.qs-banner p{font-size:20px;letter-spacing:.09em}
.qshop .qs-cd{display:block;margin-top:4px;font-size:14px;color:var(--soft)}
.qs-banner .blg small{font-size:15px;letter-spacing:.32em}
/* LEAD: on a phone the stacked banner came out nearly square (354 x 291). Logo beside the name, no rule, and the painting's own shape, so the whole picture shows in a wide rectangle. */
@media (max-width:640px){
 .qs-banner{display:flex;align-items:center;justify-content:center;aspect-ratio:3168/1344;min-height:min-content;padding:12px 16px;border-radius:16px}
 .qs-banner::after{inset:6px;border-radius:11px}
 .qs-bnin{gap:2px;width:100%}
 .qs-bnrule{display:none}
 .qs-banner .blg{flex-direction:row;gap:10px}
 .qs-banner .blg>span{align-items:flex-start;text-align:left}
 .qs-banner .blg.big .blg_e{width:50px;height:50px}
 .qs-banner .blg b{font-size:25px}
 .qs-bnkick{font-size:12px;letter-spacing:.26em}
 .qs-banner p{margin:0;font-size:16px}
 .qs-banner .blg small{margin-top:0;font-size:12.5px}
}
@media (max-width:360px){.qs-bnkick{display:none}}
/* LEAD: the one-time choice when this device and the online save disagree. Above everything, since it appears while the game loads. */
.modal.qbsv{z-index:400}
.qbsv h3{margin:0;font-size:24px}
.qbsv-r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbsv-c{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px 12px;min-height:44px;border-radius:14px;border:1px solid var(--accent);background:var(--surface2,#1a1a24);color:var(--fg,#fff);font:inherit;font-size:14px;cursor:pointer}
.qbsv-c small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.qbsv-c b{font-size:20px}
.qbsv-c span{color:var(--muted);font-size:13px}
/* LEAD: phone lag. A room window covers the building view and its SVG is already hidden, but its 500 or so CSS animations kept
   running underneath. Pause them until the window closes. */
body:has(#layer .modal) #app .lfwrap *,body:has(#layer .modal) #app .lfwrap *::before,body:has(#layer .modal) #app .lfwrap *::after{animation-play-state:paused!important}
/* LEAD: each brand's name in its own lettering (Cal: "more stylized and unique instead of plain white text or a shadow").
   The five fonts load from Google Fonts with only the letters these names use. Wherever the brand mark shows. */
.blg_hanga b{font-family:"Black Han Sans",var(--font-display);letter-spacing:.07em;color:#f3ead4;-webkit-text-stroke:1.6px #c9ff3d;paint-order:stroke fill;text-shadow:none}
.blg_y2k b{font-family:"Rubik Bubbles",var(--font-display);font-style:normal;letter-spacing:.02em;background:linear-gradient(180deg,#fff 8%,#ffc4e6 40%,#ff4fa3 52%,#b46bff 72%,#6cf0ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.9)}
.blg_over b{font-family:"Rubik Spray Paint",var(--font-display);font-style:normal;letter-spacing:.03em;color:#ff7a2e;text-shadow:none;display:inline-block;transform:rotate(-3deg)}
.blg_rose b{font-family:"Pirata One",var(--font-display);letter-spacing:.04em;background:linear-gradient(180deg,#ffe3ee 5%,#ff4f8a 50%,#b0124e 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,79,138,.45))}
.blg_alt b{font-family:"Saira Stencil One",var(--font-display);letter-spacing:.1em;background:linear-gradient(180deg,#fff 10%,#d9fbff 45%,#7fe3f7 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.qs-banner .blg_rose b{font-size:40px}
.qs-banner .blg_y2k b{font-size:31px}
@media (max-width:640px){.qs-banner .blg_rose b{font-size:29px}.qs-banner .blg_y2k b{font-size:23px}}
/* LEAD: room upgrades two or more levels away show as a mystery (Cal: excitement and curiosity for the next one). */
.addon.mystery{border-style:dashed;opacity:.85}
.addon.mystery b{letter-spacing:.35em;color:var(--accent)}
.addon.mystery small{font-style:italic}
.addons .addmore{margin:6px 2px 0;font-size:12px}
/* LEAD: inside a building, the way back to the street and the building's name. */
.lfbtop{position:absolute;left:12px;top:96px;z-index:4;display:flex;align-items:center;gap:10px}
.lfbtop .btn{min-height:40px;background:rgba(14,14,26,.82)}
.lfbtop b{font-family:var(--font-display);letter-spacing:.06em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
/* LEAD: the hint under the building view was pale grey on a pale sky (QA). */
.lfhint{color:#fff!important;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.5)}
/* ROOMS: door arrows for a door on the upper (back-right) wall, top right, clear of the zoom buttons. */
.prtb.tr{top:6px;right:52px;align-items:flex-end}
/* LEAD: story scenes (31_story.js): someone walks in and offers the next step. */
.sty .sty-who{display:flex;align-items:center;gap:12px}
.sty-pic{width:72px;height:96px;border-radius:14px;object-fit:cover;flex:none;border:1px solid var(--accent)}
.sty-pic0{display:grid;place-items:center;font:700 26px var(--font-display);color:#fff;background:linear-gradient(160deg,var(--accent),var(--accent2,#7c4dff))}
.sty-who b{display:block;font-size:20px}.sty-who small{color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
