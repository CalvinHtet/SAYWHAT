<style>@keyframes qbsh{0%{background-position:200% 0}100%{background-position:-200% 0}}#qbloadbar{background-size:200% 100%!important;animation:qbsh 1.6s linear infinite}@media (prefers-reduced-motion:reduce){#qbloadbar{animation:none}}</style>
<div id="qbload" role="status" aria-live="polite" style="position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:var(--bg)"><div style="width:min(300px,78vw);text-align:center"><div class="label">Quest Board</div><div style="margin:14px 0 8px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden"><i id="qbloadbar" style="display:block;height:100%;width:12%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),#fff6,var(--accent2),var(--accent));transition:width .25s"></i></div><small id="qbloadtx" class="mono" style="color:var(--muted)">Loading</small></div></div>
<script>/* LEAD: the game's scripts as ordinary script tags, run in order (async=false), with a bar that fills as each file lands.
   Built by tools/build.py from app/loader.html. Plain tags keep the browser's own caching: a reload in the same tab is quick. */
(function(){
  var F=/*FILES*/[],box=document.getElementById("qbload"),bar=document.getElementById("qbloadbar"),tx=document.getElementById("qbloadtx");
  var tot=F.reduce(function(a,f){return a+f[1]},0),got={},ran=0;
  var mb=function(n){return (n/1048576).toFixed(n<10485760?1:0)};
  var paint=function(){var g=0;for(var k in got)g+=got[k];var f=Math.min(1,g/tot);bar.style.width=Math.max(g?4:12,Math.round(f*100))+"%";
    tx.textContent=ran>=F.length||f>=1?"Starting":g?mb(g)+" of "+mb(tot)+" MB":"Loading "+mb(tot)+" MB"};
  var land=function(i){if(got[i])return;got[i]=F[i][1];paint()};
  var abs=F.map(function(f){var a=document.createElement("a");a.href=f[0];return a.href});
  try{new PerformanceObserver(function(l){l.getEntries().forEach(function(e){var i=abs.indexOf(e.name);if(i>=0)land(i)})}).observe({type:"resource",buffered:true})}catch(e){}
  var done=function(){bar.style.width="100%";setTimeout(function(){if(box&&box.parentNode)box.parentNode.removeChild(box)},60)};
  F.forEach(function(f,i){var s=document.createElement("script");s.src=f[0];s.async=false;
    s.onload=s.onerror=function(){land(i);if(++ran>=F.length)done()};document.body.appendChild(s)});
  paint();
})();</script>
